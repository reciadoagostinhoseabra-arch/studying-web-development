<!DOCTYPE html>
<html>
<head>

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid">
<span class="navbar-brand">Admin Panel</span>
</div>
</nav>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->

<div class="col-2 bg-dark text-white vh-100 p-3">

<h4>Menu</h4>

<ul class="nav flex-column">
<li class="nav-item"><a class="nav-link text-white" href="#">Dashboard</a></li>
<li class="nav-item"><a class="nav-link text-white" href="#">Usuários</a></li>
<li class="nav-item"><a class="nav-link text-white" href="#">Relatórios</a></li>
</ul>

</div>

<!-- MAIN -->

<div class="col-10 p-4">

<h2>Dashboard</h2>

<!-- CARDS -->

<div class="row">

<div class="col-md-4">
<div class="card p-3">
<h5>Usuários</h5>
<p>120</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Vendas</h5>
<p>50</p>
</div>
</div>

<div class="col-md-4">
<div class="card p-3">
<h5>Lucro</h5>
<p>300k kz</p>
</div>
</div>

</div>

<!-- BOTÃO MODAL -->

<button class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#modalUser">
Novo Usuário
</button>

<!-- TABELA -->

<table class="table table-striped mt-3">

<tr>
<th>Nome</th>
<th>Email</th>
<th>Ação</th>
</tr>

<tr>
<td>João</td>
<td>joao@email.com</td>
<td><button class="btn btn-danger btn-sm">Excluir</button></td>
</tr>

</table>

</div>

</div>
</div>

<!-- MODAL -->

<div class="modal fade" id="modalUser">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
<h5>Novo Usuário</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<input class="form-control mb-2" placeholder="Nome">
<input class="form-control mb-2" placeholder="Email">

</div>

<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
<button class="btn btn-primary">Salvar</button>
</div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
