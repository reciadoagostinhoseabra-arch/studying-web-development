<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4f46e5,#2563eb);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        form{
            background:#fff;
            width:350px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#555;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:15px;
            transition:.3s;
        }

        input:focus{
            border-color:#2563eb;
            box-shadow:0 0 8px rgba(37,99,235,.3);
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:#fff;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#1d4ed8;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

    <form>
        <h2>Login</h2>

        <label for="name">Nome</label>
        <input type="text" id="name" name="name" placeholder="Digite o seu nome">

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite a sua senha">

        <button type="submit" onclick="entrar()">Entrar</button>
    </form>

    <script>
        function entrar(){
             let name = document.getElementById("name").value;
            let pass = document.getElementById("password").value;

            if(name=="RECIADO" && pass=="123"){
                alert("seja bem vindo")
            }else{
                alert("senha incorreta")
            }
        }
       
    </script>
    
</body>
</html>
