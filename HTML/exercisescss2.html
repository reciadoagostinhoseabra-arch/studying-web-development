<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 30px;
        }

        /* ID */
        #titulo {
            text-align: center;
            color: darkblue;
        }

        /* Classe */
        .secao {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
        }

        /* Lista */
        ul {
            list-style-type: square;
        }

        ol {
            color: darkgreen;
        }

        /* Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background-color: #2c3e50;
            color: white;
            padding: 10px;
        }

        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Formulário */
        form {
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:focus {
            border-color: blue;
            outline: none;
        }

        .btn {
            background-color: darkblue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: green;
        }

    </style>
</head>

<body>

    <h1 id="titulo">Sistema Escolar</h1>

    <div class="secao">
        <h2>Disciplinas Disponíveis</h2>

        <ul>
            <li>Matemática</li>
            <li>Programação</li>
            <li>Física</li>
        </ul>

        <h3>Ordem de Prioridade</h3>
        <ol>
            <li>Programação</li>
            <li>Matemática</li>
            <li>Física</li>
        </ol>
    </div>

    <div class="secao">
        <h2>Tabela de Notas</h2>

        <table>
            <tr>
                <th>Nome</th>
                <th>Disciplina</th>
                <th>Nota</th>
            </tr>
            <tr>
                <td>Ana</td>
                <td>Matemática</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Pedro</td>
                <td>Programação</td>
                <td>18</td>
            </tr>
        </table>
    </div>

    <div class="secao">
        <h2>Formulário de Inscrição</h2>

        <form>

            <label>Nome:</label>
            <input type="text" placeholder="Digite seu nome">

            <label>Email:</label>
            <input type="email" placeholder="Digite seu email">

            <label>Idade:</label>
            <input type="number">

            <label>Disciplina:</label>
            <select>
                <option>Matemática</option>
                <option>Programação</option>
                <option>Física</option>
            </select>

            <label>Gênero:</label>
            <input type="radio" name="genero"> Masculino
            <input type="radio" name="genero"> Feminino

            <br><br>

            <input type="submit" value="Cadastrar" class="btn">

        </form>
    </div>

</body>
</html>
