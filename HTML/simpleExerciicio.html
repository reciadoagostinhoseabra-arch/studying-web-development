<!DOCTYPE html>
<html>
<head>
<title>Perfil do Estudante</title>

<style>

body{
    font-family: Arial;
    background-color:#f5f5f5;
}

#perfil{
    text-align:center;
}

.card{
    background:white;
    width:400px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 2px 5px gray;
}

img{
    width:120px;
    border-radius:50%;
}

.habilidade{
    color:blue;
}

button{
    background-color:green;
    color:white;
    padding:10px;
    border:none;
    cursor:pointer;
}

button:hover{
    background-color:black;
    color:blue
}

table{
    width:100%;
    margin-top:15px;
}

td,th{
    border:1px solid gray;
    padding:5px;
}

</style>

</head>

<body>

<div class="card">

<h2 id="perfil">Perfil do Estudante</h2>

<center><img src="./image/reci.jpeg"></center>

<p class="habilidade">Programação</p>
<p class="habilidade">Design</p>
<p class="habilidade">Base de Dados</p>

<button>Seguir</button>

<h3>Notas</h3>

<table>

<tr>
<th>Disciplina</th>
<th>Nota</th>
</tr>

<tr>
<td>Programação</td>
<td>18</td>
</tr>

<tr>
<td>Matemática</td>
<td>16</td>
</tr>

</table>

</div>

</body>
</html>
