<!DOCTYPE html>
<html>
<head>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.form-box{
background:white;
width:350px;
margin:auto;
padding:20px;
border-radius:10px;
}

input,select,textarea{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
}

.botao{
background:blue;
color:white;
border:none;
padding:10px;
cursor:pointer;
}

.botao:hover{
background:green;
}

</style>

</head>

<body>

<div class="form-box">

<h2>Cadastro</h2>

<form>

<label>Nome</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Idade</label>
<input type="number">

<label>Curso</label>

<select>
<option>Programação</option>
<option>Design</option>
<option>Redes</option>
</select>

<label>Mensagem</label>

<textarea></textarea>

<input type="submit" value="Enviar" class="botao">

</form>

</div>

</body>

</html>
